name: Daraja Stale Payment Reconciler

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      staleMinutes:
        description: "Reconciliation lookback in minutes (1-240)"
        required: false
        default: "1"

permissions: {}

jobs:
  reconcile-stale-payments:
    name: Reconcile stale Daraja payments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daraja-stale-reconciliation-cron
      cancel-in-progress: false

    steps:
      - name: Validate required secrets
        env:
          RECONCILE_ENDPOINT: ${{ secrets.DARAJA_RECONCILE_PAYMENTS_URL }}
          DARAJA_CRON_SECRET: ${{ secrets.DARAJA_RECONCILE_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${RECONCILE_ENDPOINT}" ]; then
            echo "Missing secret: DARAJA_RECONCILE_PAYMENTS_URL"
            exit 1
          fi

          if [ -z "${DARAJA_CRON_SECRET}" ]; then
            echo "Missing secret: DARAJA_RECONCILE_CRON_SECRET"
            exit 1
          fi

      - name: Trigger stale reconciliation endpoint
        env:
          RECONCILE_ENDPOINT: ${{ secrets.DARAJA_RECONCILE_PAYMENTS_URL }}
          DARAJA_CRON_SECRET: ${{ secrets.DARAJA_RECONCILE_CRON_SECRET }}
          INPUT_STALE_MINUTES: ${{ github.event.inputs.staleMinutes }}
        run: |
          set -euo pipefail

          stale_minutes="${INPUT_STALE_MINUTES:-1}"
          if ! [[ "${stale_minutes}" =~ ^[0-9]+$ ]]; then
            stale_minutes="1"
          fi

          if [ "${stale_minutes}" -lt 1 ]; then
            stale_minutes=1
          fi

          if [ "${stale_minutes}" -gt 240 ]; then
            stale_minutes=240
          fi

          response_file="$(mktemp)"
          status_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST "${RECONCILE_ENDPOINT}?staleMinutes=${stale_minutes}" \
            --header "Authorization: Bearer ${DARAJA_CRON_SECRET}" \
            --header "x-cron-secret: ${DARAJA_CRON_SECRET}")"

          echo "HTTP status: ${status_code}"
          echo "Response body:"
          cat "${response_file}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Daraja stale reconciliation request failed"
            exit 1
          fi
